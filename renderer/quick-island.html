<!DOCTYPE html>
<html lang="zh-CN" data-appearance="system-glass-blurred">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>悬浮岛</title>
    <link rel="stylesheet" href="quick-island.css" />
    <link rel="stylesheet" href="codex-float.css" />
    <link rel="stylesheet" href="ai-tools.css" />
    <link rel="stylesheet" href="appearance.css" />
    <link rel="stylesheet" href="quick-preferences.css" />
    <link rel="stylesheet" href="window-motion.css" />
    <link rel="stylesheet" href="card-reflow.css" />
  </head>
  <body>
    <section id="quick-island" data-visible="false" data-mirror="false" aria-label="悬浮岛" aria-hidden="true" inert>
      <span class="appearance-glass-rim" aria-hidden="true"></span>
      <header class="island-topbar">
        <nav class="island-nav" aria-label="悬浮岛入口">
          <button type="button" class="island-brand" data-island-action="focus" aria-label="保持悬浮岛打开">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 17.5c-2-2-2-4.9 0-6.9l4.8-4.8 5.9 5.9-4.8 4.8c-2 2-4 2-5.9 1Z"/><path d="m9.5 8.6 5.9 5.9M5.4 19.5l2.1-2"/></svg>
            <span>悬浮岛</span><span id="quick-version" class="sr-only"></span>
          </button>
          <button type="button" class="workspace-link" data-workspace="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16l-1 11H5L4 8Z"/><path d="M8 8V5h8v3"/></svg>
            <span>工作台</span>
          </button>
          <button type="button" class="workspace-link" data-workspace="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 7 2 2 4-4M13 7h7M4 15l2 2 4-4M13 15h7"/></svg><span>待办</span></button>
          <button type="button" class="workspace-link" data-workspace="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5h6l2 3h10v12H3Z"/><path d="M3 8h18"/></svg><span>项目抽屉</span></button>
          <button type="button" class="workspace-link" data-workspace="codes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/></svg><span>code列表</span></button>
        </nav>
        <button type="button" class="island-cap-handle" data-island-action="focus" aria-label="保持悬浮岛打开"></button>
        <div class="island-tools">
          <button type="button" id="quick-mirror" class="tool-button mirror-button" aria-label="打开实时镜子" aria-pressed="false" title="镜子"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="4"/><path d="M6 21h12M9 13.5 7 21M15 13.5l2 7.5"/><circle cx="12" cy="9" r="1"/></svg></button>
          <span id="quick-activity" class="quick-activity" hidden></span>
          <button type="button" class="tool-button" data-quick-preference="appearance" aria-label="选择外观" title="外观" aria-expanded="false" aria-controls="quick-appearance-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button type="button" class="tool-button" data-quick-preference="size" aria-label="选择尺寸" title="尺寸" aria-expanded="false" aria-controls="quick-size-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg>
          </button>
          <button type="button" class="tool-button" data-workspace="settings" aria-label="打开设置" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          </button>
          <button type="button" class="tool-button collapse-tool" data-island-action="hide" aria-label="收起悬浮岛" title="收起">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>
          </button>
        </div>
      </header>

      <section id="quick-appearance-panel" class="quick-preference-panel" aria-labelledby="quick-appearance-title" hidden>
        <header><strong id="quick-appearance-title">外观</strong><span>窗口风格</span></header>
        <div id="settings-appearance-options" role="radiogroup" aria-label="窗口风格"></div>
        <p id="settings-appearance-note" role="status" aria-live="polite" aria-atomic="true">正在读取外观…</p>
      </section>
      <section id="quick-size-panel" class="quick-preference-panel" aria-labelledby="quick-size-title" hidden>
        <header><strong id="quick-size-title">尺寸</strong><span>窗口宽度</span></header>
        <div id="settings-window-size-options" role="radiogroup" aria-label="窗口尺寸"></div>
        <p id="settings-window-size-note" role="status" aria-live="polite" aria-atomic="true">正在读取尺寸…</p>
      </section>

      <main class="island-content">
        <section class="quick-codex" data-island-tier="primary" aria-label="Codex 任务状态与额度"><div id="quick-codex"></div></section>

        <section class="quick-pomodoro" data-island-tier="primary" aria-label="番茄钟，二十五分钟专注与五分钟休息循环">
          <div class="module-heading"><span class="module-kicker">专注时刻</span><button type="button" id="quick-timer-reset" class="timer-reset" aria-label="重置番茄钟" title="重置">↻</button></div>
          <div class="quick-timer-ring">
            <svg class="timer-track" viewBox="0 0 120 120" aria-hidden="true"><circle class="timer-track-bg" cx="60" cy="60" r="53"/><circle id="quick-timer-progress" cx="60" cy="60" r="53"/></svg>
            <div class="timer-readout"><span id="quick-timer-state">正在同步</span><strong id="quick-timer-time">--:--</strong><button type="button" id="quick-timer-toggle" aria-label="开始番茄钟" disabled><svg class="timer-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg><svg class="timer-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button></div>
          </div>
          <label class="timer-duration"><span>专注时长</span><select id="quick-timer-duration" aria-label="番茄钟专注时长"><option value="300">5 分钟</option><option value="900">15 分钟</option><option value="1500">25 分钟</option><option value="2700">45 分钟</option><option value="3600">60 分钟</option></select></label>
        </section>

        <section class="quick-calendar" data-island-tier="support" aria-label="本周与今日待办">
          <div class="module-heading"><button type="button" id="quick-month" data-workspace="todo" aria-label="打开待办"></button><span class="module-kicker">本周</span></div>
          <div id="quick-week" class="quick-week"></div>
          <button type="button" class="today-agenda" data-workspace="todo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg>
            <span class="agenda-copy"><strong id="quick-agenda-title">今天没有待办事项</strong><small id="quick-agenda-meta">待办</small></span>
            <span id="quick-todo-count" class="todo-count" hidden></span>
          </button>
          <button type="button" class="calendar-all" data-workspace="todo">查看全部待办 <span aria-hidden="true">↗</span></button>
        </section>

        <section class="quick-note" data-island-tier="support" aria-label="随笔记">
          <div class="module-heading"><span class="module-kicker">随笔记</span><button type="button" id="quick-note-save" class="note-save" aria-label="保存随笔记到笔记库">保存</button></div>
          <textarea id="quick-note-input" aria-label="随笔记内容" placeholder="想到什么，就记下来…" spellcheck="false"></textarea>
          <div class="note-footer"><span id="quick-note-status" role="status">本机保存</span><button type="button" data-workspace="notes" aria-label="打开笔记库">笔记库 ↗</button></div>
        </section>

        <section class="quick-clock" data-island-tier="secondary" aria-label="时钟、天气与待办热力格">
          <div class="module-kicker">此刻</div>
          <time id="quick-clock-time" class="clock-time">--:--</time>
          <div id="quick-clock-date" class="clock-date"></div>
          <button type="button" id="quick-weather" class="weather-entry" aria-label="设置天气城市"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M9 2v1M3 8H2M4 3l1 1M15 3l-1 1M6 18h12a3 3 0 0 0 0-6 5 5 0 0 0-9-2 4 4 0 0 0-3 8Z"/></svg><span><strong id="quick-weather-label">设置城市</strong><span id="quick-weather-detail" class="weather-hint">查看当地天气 ↗</span></span></button>
          <button type="button" class="heatmap-label" data-workspace="todo">近 28 天待办<span id="quick-heatmap-count"></span></button>
          <div id="quick-heatmap" class="quick-heatmap" aria-label="按截止日期统计的近 28 天待办"></div>
        </section>

        <section class="quick-apps" data-island-tier="secondary" aria-label="常用应用">
          <div class="module-heading"><span class="module-kicker">常用应用</span><button id="quick-apps-edit" type="button" class="quick-apps-edit" aria-pressed="false" aria-controls="quick-apps-grid">更换</button></div>
          <div id="quick-apps-grid" class="quick-apps-grid"></div>
          <p id="quick-apps-empty" class="module-empty">正在读取应用…</p>
          <p id="quick-apps-hint" class="quick-apps-hint" hidden>点图标更换 · 自动保存</p>
        </section>
      </main>

      <dialog id="quick-weather-dialog" class="quick-weather-dialog" aria-label="设置天气城市">
        <header><strong>天气城市</strong><button type="button" id="quick-weather-close" aria-label="关闭天气设置">关闭</button></header>
        <form id="quick-weather-form">
          <label for="quick-weather-city">城市名称</label>
          <input id="quick-weather-city" type="text" maxlength="80" required placeholder="例如：上海或 Beijing" autocomplete="off" />
          <p id="quick-weather-note">输入城市即可查看天气，无需开启定位。</p>
          <div class="weather-actions"><button type="button" id="quick-weather-system">打开系统天气 ↗</button><button type="submit" class="weather-save">保存城市</button></div>
          <small class="weather-attribution">天气数据：Open-Meteo</small>
        </form>
      </dialog>
      <section id="quick-mirror-panel" class="quick-mirror-panel" aria-label="实时镜子" hidden>
        <header><span>镜子</span><button type="button" data-mirror-action="close" aria-label="关闭实时镜子">关闭</button></header>
        <video id="quick-mirror-video" muted playsinline></video>
      </section>
      <div id="quick-message" class="quick-message" role="status" aria-live="polite" hidden></div>
    </section>
    <script src="ai-tools.js"></script>
    <script src="card-reflow.js"></script>
    <script src="appearance.js"></script>
    <script src="window-size.js"></script>
    <script src="window-motion.js"></script>
    <script src="appearance-surface.js"></script>
    <script src="codex-float.js"></script>
    <script src="quick-island.js"></script>
  </body>
</html>
